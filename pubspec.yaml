name: alhaytham

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - images/alhaytham_logo/

  fonts:
    - family: TheYearofHandicrafts
      fonts:
        - asset: fonts/OTF/TheYearofHandicrafts-Regular.otf
          weight: 400
        - asset: fonts/OTF/TheYearofHandicrafts-Medium.otf
          weight: 500
        - asset: fonts/OTF/TheYearofHandicrafts-SemiBold.otf
          weight: 600
        - asset: fonts/OTF/TheYearofHandicrafts-Bold.otf
          weight: 700
        - asset: fonts/OTF/TheYearofHandicrafts-Black.otf
          weight: 900